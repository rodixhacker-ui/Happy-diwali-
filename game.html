<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tumi amay valobasho? 💖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --pink-bg: #fff0f5;
  --pink-main: #ff69b4;
  --pink-dark: #d63384;
  --pink-light: #ffb6c1;
  --white: #ffffff;
  --gold: #d4af37;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
  margin:0;padding:0; font-family:'Cormorant Garamond', Georgia, serif;
  background: linear-gradient(135deg, #ffe6f0 0%, #ffd1e3 100%);
  color: var(--pink-dark); min-height: 100vh; overflow: hidden;
  display: flex; align-items: center; justify-content: center; position: relative;
}

/* Floating Hearts Background */
.hearts-bg{position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.heart-bg{position:absolute; color:var(--pink-main); opacity:0.3; animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0.5) rotate(0deg); opacity:0}
  20%{opacity:0.6}
  100%{transform:translateY(-10vh) scale(1.2) rotate(360deg); opacity:0}
}

/* Main Prank Container (Cute Soft Card) */
.prank-container {
  position: relative; z-index: 10; background: rgba(255, 255, 255, 0.95);
  padding: 45px 30px; border-radius: 30px;
  box-shadow: 0 20px 50px rgba(255, 105, 180, 0.25), 0 0 0 6px #fff, 0 0 0 8px var(--pink-light);
  border: 1px solid var(--pink-main);
  text-align: center; width: 90%; max-width: 450px; transition: transform 0.3s ease;
}

.cute-avatar {
  width: 130px; height: 130px; margin: 0 auto 20px;
  background-image: url('dress.png'); background-size: cover;
  background-position: top center; background-repeat: no-repeat;
  border-radius: 50%; border: 5px solid var(--white);
  box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4), 0 0 0 2px var(--gold);
  background-color: var(--pink-light); animation: bounce 2s infinite ease-in-out;
  transition: background-image 0.3s ease;
}
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

h1 {
  font-family: 'Playfair Display', Georgia, serif; 
  font-size: clamp(1.8rem, 6vw, 2.4rem);
  color: var(--pink-dark); margin: 0 0 20px; line-height: 1.3; font-weight: 600;
}

.funny-text {
  font-size: 1.05rem; color: var(--pink-main); margin-bottom: 25px;
  height: 24px; font-weight: 600; font-style: italic;
  transition: 0.3s;
}

.btn-box { display: flex; justify-content: center; gap: 20px; position: relative; height: 60px; align-items: center; }

.btn {
  border: none; padding: 14px 35px; border-radius: 30px;
  font-size: 1.1rem; font-weight: 600; font-family: 'Poppins', sans-serif;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

#btn-yes {
  background: linear-gradient(135deg, #ff69b4, #ff1493); color: #fff;
  box-shadow: 0 8px 25px rgba(255, 20, 147, 0.4); z-index: 20;
}
#btn-yes:hover { transform: scale(1.05); }

#btn-no {
  background: #f1f1f1; color: #888; position: relative;
}

/* Win Message Box */
#win-message { display: none; animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

#win-message h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 2.2rem; color: var(--pink-dark); margin-bottom: 15px; font-weight: 600; }
#win-message p { font-size: 1.15rem; color: var(--pink-main); line-height: 1.7; font-style: italic; }

.back-link {
  display: inline-block; margin-top: 30px; color: var(--pink-dark);
  text-decoration: none; font-weight: 600; font-size: 0.95rem;
  background: var(--pink-bg); padding: 10px 20px; border-radius: 20px; transition: 0.3s;
}
.back-link:hover { background: var(--pink-light); }
</style>
</head>
<body>

<div class="hearts-bg" id="hearts-bg"></div>

<div class="prank-container" id="prank-container">
  <div class="cute-avatar" id="avatar"></div>
  
  <div id="question-box">
    <h1 id="question-text">Baby tumi amake<br>valobasho? 🥺</h1>
    <p class="funny-text" id="funny-text"></p>
    <div class="btn-box" id="btn-container">
      <button class="btn" id="btn-yes" onclick="handleYes()">Yes</button>
      <button class="btn" id="btn-no" onclick="dodgeNo()" onmouseover="dodgeNo()" ontouchstart="dodgeNo()">No</button>
    </div>
  </div>

  <div id="win-message">
    <h2>Yayyy! 😍💖</h2>
    <p>Tumi toh amar jibon! Ami tomake khub valobashi meri jaan. Shubho Diwali! 🪔✨</p>
    <a href="index.html" class="back-link">← Main Page e Ferot Jao</a>
  </div>
</div>

<script>
const btnNo = document.getElementById('btn-no');
const btnYes = document.getElementById('btn-yes');
const funnyText = document.getElementById('funny-text');
const avatar = document.getElementById('avatar');
const questionText = document.getElementById('question-text');

let currentLevel = 1;
let dodgeCount = 0;

const messages = [
  "Achha? Abar vebe dekho! 😤",
  "Ki holo? Kadiye dile toh! 🥺",
  "Ami mana korbo na! Yes chapo! 😉",
  "Tumi amake valobasho, ami jani! 🥰",
  "Ekhon thamo, Yes chapo! 😂"
];

const levels = {
  1: {
    q: "Baby tumi amake<br>valobasho? 🥺",
    nextQ: "Baby tumi ki<br>chirokal amar sathe thakbe? 💍"
  },
  2: {
    q: "Baby tumi ki<br>chirokal amar sathe thakbe? 💍",
    nextQ: "Tumi ki amake<br>biye korbe? 💖"
  },
  3: {
    q: "Tumi ki amake<br>biye korbe? 💖",
    nextQ: null
  }
};

function dodgeNo() {
  avatar.style.backgroundImage = "url('rona.png')";
  
  if (dodgeCount < messages.length) {
    funnyText.innerText = messages[dodgeCount];
  } else {
    funnyText.innerText = "Tumi amake valobasho, ami jani! 🥰";
  }
  dodgeCount++;

  const currentScale = parseFloat(btnYes.style.transform.replace('scale(', '').replace(')', '')) || 1;
  btnYes.style.transform = `scale(${currentScale + 0.15})`;

  const padding = 20;
  const maxX = window.innerWidth - btnNo.offsetWidth - padding;
  const maxY = window.innerHeight - btnNo.offsetHeight - padding;
  
  const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
  const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
  
  btnNo.style.position = 'fixed';
  btnNo.style.left = randomX + 'px';
  btnNo.style.top = randomY + 'px';
  
  const randomRotate = Math.floor(Math.random() * 40) - 20;
  btnNo.style.transform = `rotate(${randomRotate}deg)`;
}

function handleYes() {
  if (currentLevel < 3) {
    funnyText.innerText = "Wow! Tumi toh amar shob kichu! 😍";
    
    setTimeout(() => {
      currentLevel++;
      questionText.innerHTML = levels[currentLevel].q;
      
      btnNo.style.position = 'relative';
      btnNo.style.left = 'auto';
      btnNo.style.top = 'auto';
      btnNo.style.transform = 'none';
      
      btnYes.style.transform = 'scale(1)';
      avatar.style.backgroundImage = "url('dress.png')";
      
      funnyText.innerText = "";
      dodgeCount = 0;
    }, 2000);
    
  } else {
    document.getElementById('question-box').style.display = 'none';
    document.getElementById('win-message').style.display = 'block';
    
    const blastIcons = ['💖', '💕', '✨', '🌸', '💘'];
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart-bg';
        h.textContent = blastIcons[Math.floor(Math.random()*blastIcons.length)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.top = '100vh';
        h.style.fontSize = (Math.random() * 30 + 20) + 'px';
        h.style.animation = 'floatUp 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
        h.style.opacity = '1';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2500);
      }, i * 40);
    }
  }
}
</script>
</body>
</html>
